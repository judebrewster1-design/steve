<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f212e">
    <title>Judeceno Casino - Mobile Optimized</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX/TSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              stake: {
                dark: '#0f212e',
                darker: '#07151e',
                card: '#1a2c38',
                hover: '#2f4553',
                green: '#00e701',
                greenHover: '#00c701',
                accent: '#00e701',
                text: '#b1bad3',
                white: '#ffffff',
                red: '#ff4d4d',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'glow': '0 0 15px rgba(0, 231, 1, 0.4)',
              'glow-red': '0 0 15px rgba(255, 77, 77, 0.4)',
              'glow-card': '0 0 20px rgba(0,0,0,0.5)',
              'inner-light': 'inset 0 1px 0 rgba(255,255,255,0.1)'
            },
            backgroundImage: {
              'aura-gradient': 'radial-gradient(circle at 50% 0%, #1a2c38 0%, #0f212e 100%)',
              'card-gradient': 'linear-gradient(145deg, #1a2c38, #15232d)',
              'btn-gradient': 'linear-gradient(to bottom, #00e701, #00c701)'
            }
          }
        }
      }
    </script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f212e;
        background-image: radial-gradient(circle at 50% -20%, #213743 0%, #0f212e 50%, #07151e 100%);
        background-attachment: fixed;
        color: #b1bad3;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2f4553; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #415969; }

      @keyframes pop-in {
        0% { transform: scale(0.9) translateY(10px); opacity: 0; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }
      .animate-pop-in { animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
        20%, 40%, 60%, 80% { transform: translateX(4px); }
      }
      .animate-shake { animation: shake 0.4s ease-in-out; }

      @keyframes slide-up {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }

      .perspective-1000 { perspective: 1000px; }
      .transform-style-3d { transform-style: preserve-3d; }
      .backface-hidden { backface-visibility: hidden; }
      .rotate-y-180 { transform: rotateY(180deg); }
      
      .glass {
        background: rgba(26, 44, 56, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .input-field {
        background: #07151e;
        border: 1px solid #2f4553;
        transition: all 0.2s;
        font-size: 16px; /* Prevent iOS zoom */
      }
      .input-field:focus {
        border-color: #00e701;
        box-shadow: 0 0 0 2px rgba(0, 231, 1, 0.1);
        outline: none;
      }
      
      .demo-badge {
        background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        animation: pulse 2s infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; }
      }

      /* Mobile optimizations */
      @media (max-width: 768px) {
        .mobile-bottom-nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          background: rgba(15, 33, 46, 0.95);
          backdrop-filter: blur(20px);
          border-top: 1px solid rgba(255, 255, 255, 0.05);
          padding: 8px 0 max(8px, env(safe-area-inset-bottom));
          z-index: 100;
        }
        
        .safe-area-bottom {
          padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }
        
        .safe-area-top {
          padding-top: max(1rem, env(safe-area-inset-top));
        }
      }

      /* Touch feedback */
      .touch-feedback:active {
        transform: scale(0.97);
        opacity: 0.9;
      }

      /* Loading spinner */
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #00e701;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 0.8s linear infinite;
      }

      /* Prevent text selection on game elements */
      .no-select {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      /* Smooth scrolling */
      .smooth-scroll {
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const API_URL = 'https://attacks-estimates-conferences-korea.trycloudflare.com';

        // Debounce hook for performance
        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => setDebouncedValue(value), delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        }

        async function apiRequest(endpoint, body = {}, method = 'POST') {
            try {
                const config = {
                    method,
                    headers: { 'Content-Type': 'application/json' }
                };
                if (method !== 'GET' && Object.keys(body).length > 0) {
                    config.body = JSON.stringify(body);
                }
                const res = await fetch(`${API_URL}${endpoint}`, config);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'API Error');
                return data;
            } catch (err) {
                console.error(`API Error [${endpoint}]:`, err);
                throw err;
            }
        }

        const authApi = {
            login: async (u, p) => {
                const res = await apiRequest('/login', { username: u, password: p });
                return { username: res.username, balance: res.balance, isDemo: res.isDemo };
            },
            register: async (u, p) => {
                const res = await apiRequest('/register', { username: u, password: p });
                return { username: res.username, balance: res.balance, isDemo: res.isDemo };
            },
            demoLogin: async () => {
                const res = await apiRequest('/demo-login', {});
                return { username: res.username, balance: res.balance, isDemo: true };
            }
        };

        const blackjackApi = {
            deal: (username, bet) => apiRequest('/blackjack/deal', { username, bet }),
            hit: (username) => apiRequest('/blackjack/hit', { username }),
            stand: (username) => apiRequest('/blackjack/stand', { username })
        };

        const minesApi = {
            start: (username, bet, mineCount) => apiRequest('/mines/start', { username, bet, mineCount }),
            reveal: (username, index) => apiRequest('/mines/reveal', { username, index }),
            cashout: (username) => apiRequest('/mines/cashout', { username })
        };

        const coinflipApi = {
            play: (username, bet, choice) => apiRequest('/coinflip/play', { username, bet, choice })
        };

        const rouletteApi = {
            spin: (username, bet, betType) => apiRequest('/roulette/spin', { username, bet, betType })
        };

        const towersApi = {
            start: (username, bet, difficulty) => apiRequest('/towers/start', { username, bet, difficulty }),
            pick: (username, position) => apiRequest('/towers/pick', { username, position }),
            cashout: (username) => apiRequest('/towers/cashout', { username })
        };

        const plinkoApi = {
            drop: (username, bet, risk) => apiRequest('/plinko/drop', { username, bet, risk })
        };

        const hiloApi = {
            start: (username, bet) => apiRequest('/hilo/start', { username, bet }),
            guess: (username, guess) => apiRequest('/hilo/guess', { username, guess }),
            cashout: (username) => apiRequest('/hilo/cashout', { username })
        };

        // ==========================================
        // UI COMPONENTS
        // ==========================================

        const LoadingSpinner = () => (
            <div className="flex items-center justify-center p-8">
                <div className="spinner"></div>
            </div>
        );

        const MobileBottomNav = ({ activeGame, onSelectGame, onShowMenu }) => {
            const games = [
                { id: null, name: 'Home', icon: '🏠' },
                { id: 'mines', name: 'Mines', icon: '💣' },
                { id: 'blackjack', name: 'Cards', icon: '🃏' },
                { id: 'more', name: 'More', icon: '⋯' },
            ];

            return (
                <div className="mobile-bottom-nav block md:hidden">
                    <div className="flex justify-around items-center">
                        {games.map((game) => (
                            <button
                                key={game.id || 'home'}
                                onClick={() => game.id === 'more' ? onShowMenu() : onSelectGame(game.id)}
                                className={`flex flex-col items-center gap-1 px-4 py-2 transition-all touch-feedback ${
                                    activeGame === game.id ? 'text-stake-green' : 'text-gray-400'
                                }`}
                            >
                                <span className="text-2xl">{game.icon}</span>
                                <span className="text-xs font-medium">{game.name}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const MobileGameMenu = ({ onClose, onSelectGame }) => {
            const allGames = [
                { id: 'mines', name: 'Mines', icon: '💣' },
                { id: 'blackjack', name: 'Blackjack', icon: '🃏' },
                { id: 'plinko', name: 'Plinko', icon: '🎯' },
                { id: 'roulette', name: 'Roulette', icon: '🎡' },
                { id: 'coinflip', name: 'Coin Flip', icon: '🪙' },
                { id: 'towers', name: 'Towers', icon: '🏢' },
                { id: 'hilo', name: 'Hi-Lo', icon: '📊' },
            ];

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm" onClick={onClose}>
                    <div className="fixed bottom-0 left-0 right-0 bg-stake-card rounded-t-3xl p-6 animate-slide-up safe-area-bottom" onClick={e => e.stopPropagation()}>
                        <div className="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-6"></div>
                        <h3 className="text-xl font-bold text-white mb-4">All Games</h3>
                        <div className="grid grid-cols-3 gap-3 max-h-96 overflow-y-auto smooth-scroll">
                            {allGames.map((game) => (
                                <button
                                    key={game.id}
                                    onClick={() => {
                                        onSelectGame(game.id);
                                        onClose();
                                    }}
                                    className="flex flex-col items-center gap-2 p-4 bg-stake-hover rounded-xl touch-feedback transition-all hover:bg-stake-hover/80"
                                >
                                    <span className="text-4xl">{game.icon}</span>
                                    <span className="text-sm font-medium text-white">{game.name}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const TopBar = ({ user, onLogout }) => (
            <div className="h-16 glass fixed top-0 w-full z-50 border-b border-white/5 shadow-lg flex items-center justify-between px-4 backdrop-blur-md safe-area-top">
                <div className="flex items-center gap-3">
                    <div className="text-xl md:text-2xl font-black text-white tracking-tight flex items-center gap-1 cursor-pointer" onClick={() => window.location.reload()}>
                        <span className="text-stake-green drop-shadow-[0_0_8px_rgba(0,231,1,0.5)]">JUD</span><span className="hidden sm:inline">ECENO</span>
                    </div>
                </div>
                <div className="flex items-center gap-2 md:gap-4">
                    {user ? (
                        <>
                            {user.isDemo && (
                                <div className="demo-badge text-black font-black text-[10px] md:text-xs px-2 md:px-3 py-1 rounded-full shadow-lg">
                                    DEMO
                                </div>
                            )}
                            <div className="bg-black/40 rounded-full px-3 md:px-5 py-1.5 md:py-2 flex items-center gap-2 border border-white/10 shadow-inner-light">
                                <span className="text-xs md:text-sm font-bold font-mono text-stake-green">${(user.balance / 100).toFixed(2)}</span>
                            </div>
                            <button onClick={onLogout} className="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-br from-stake-hover to-stake-card rounded-full flex items-center justify-center text-white font-bold border border-white/20 shadow-lg touch-feedback">
                                {user.username[0].toUpperCase()}
                            </button>
                        </>
                    ) : null}
                </div>
            </div>
        );

        // ==========================================
        // GAME COMPONENTS
        // ==========================================

        const CardView = ({ card, hidden, small }) => {
            const sizeClass = small ? 'w-16 h-24 text-sm' : 'w-20 h-32 md:w-24 md:h-36';
            
            if (hidden) return (
                <div className={`${sizeClass} bg-stake-card border-2 border-stake-hover rounded-xl flex items-center justify-center shadow-2xl relative overflow-hidden`}>
                     <span className="text-2xl md:text-4xl opacity-50">♠️</span>
                </div>
            );
            if (!card) return null;
            return (
                <div className={`${sizeClass} bg-white rounded-xl flex flex-col items-center justify-center shadow-xl relative overflow-hidden ${card.color === 'red' ? 'text-red-600' : 'text-black'}`}>
                    <div className="absolute top-1 left-1 md:top-2 md:left-2 text-base md:text-xl font-bold leading-none">{card.value}</div>
                    <div className="text-3xl md:text-5xl">{card.suit === 'hearts' ? '♥' : card.suit === 'diamonds' ? '♦' : card.suit === 'clubs' ? '♣' : '♠'}</div>
                    <div className="absolute bottom-1 right-1 md:bottom-2 md:right-2 text-base md:text-xl font-bold leading-none rotate-180">{card.value}</div>
                </div>
            );
        };

        const Blackjack = ({ user, updateBalance }) => {
            const [state, setState] = useState({ bet: 10, result: null, playerHand: [], dealerHand: [], gameStarted: false });
            const [loading, setLoading] = useState(false);
            
            const deal = async () => {
                if (state.bet * 100 > user.balance) return alert("Insufficient funds");
                setLoading(true);
                try {
                    const res = await blackjackApi.deal(user.username, state.bet * 100);
                    updateBalance(res.newBalance);
                    setState({ ...state, gameStarted: true, playerHand: res.playerHand, dealerHand: res.dealerHand, result: null });
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };
            
            const hit = async () => {
                setLoading(true);
                try {
                    const res = await blackjackApi.hit(user.username);
                    if (res.bust) {
                        updateBalance(res.newBalance);
                        setState({ ...state, playerHand: res.playerHand, result: { win: 0, message: 'Bust!' } });
                    } else {
                        setState({ ...state, playerHand: res.playerHand });
                    }
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };
            
            const stand = async () => {
                setLoading(true);
                try {
                    const res = await blackjackApi.stand(user.username);
                    updateBalance(res.newBalance);
                    const msg = res.result === 'win' ? 'You Win!' : res.result === 'push' ? 'Push' : 'Dealer Wins';
                    setState({ ...state, dealerHand: res.dealerHand, result: { win: res.result === 'win' ? state.bet * 200 : 0, message: msg } });
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col items-center justify-center w-full max-w-4xl mx-auto p-4 gap-6 md:gap-12 pb-24 md:pb-4">
                    <div className="flex gap-2 md:gap-4 items-center justify-center min-h-[100px] md:min-h-[160px] flex-wrap">
                        {state.gameStarted ? state.dealerHand.map((c, i) => 
                            <div key={i} className="animate-pop-in" style={{animationDelay: `${i*0.1}s`}}><CardView card={c} small={window.innerWidth < 768} /></div>
                        ) : <div className="text-gray-600 font-bold uppercase tracking-widest text-xs md:text-sm border border-gray-700 px-4 md:px-6 py-2 md:py-3 rounded-full">Dealer Pays on 17</div>}
                    </div>

                    {state.result && (
                        <div className="bg-black/60 backdrop-blur-md border border-stake-green/30 px-6 md:px-12 py-4 md:py-6 rounded-2xl text-center shadow-glow z-20">
                            <div className={`text-2xl md:text-4xl font-black mb-2 ${state.result.win > 0 ? 'text-stake-green drop-shadow-md' : 'text-white'}`}>{state.result.message}</div>
                            {state.result.win > 0 && <div className="text-stake-green font-mono text-lg md:text-xl">+${(state.result.win / 100).toFixed(2)}</div>}
                        </div>
                    )}

                    <div className="flex gap-2 md:gap-4 items-center justify-center min-h-[100px] md:min-h-[160px] flex-wrap">
                        {state.gameStarted ? state.playerHand.map((c, i) => 
                            <div key={i} className="animate-pop-in" style={{animationDelay: `${i*0.1}s`}}><CardView card={c} small={window.innerWidth < 768} /></div>
                        ) : <div className="w-20 h-32 md:w-24 md:h-36 border-2 border-dashed border-gray-700 rounded-xl flex items-center justify-center text-gray-700 font-bold text-xs md:text-base">BET</div>}
                    </div>

                    <div className="w-full max-w-lg glass p-4 md:p-6 rounded-2xl shadow-2xl border border-white/5">
                        {!state.gameStarted || state.result ? (
                            <div className="flex gap-3 md:gap-4">
                                <input 
                                    type="number" 
                                    min="1" 
                                    value={state.bet} 
                                    onChange={(e) => setState({ ...state, bet: Math.max(1, Number(e.target.value)) })} 
                                    className="w-full input-field rounded-xl px-4 py-3 text-white font-mono font-bold text-base md:text-lg" 
                                />
                                <button 
                                    onClick={deal} 
                                    disabled={loading}
                                    className="bg-btn-gradient hover:shadow-glow text-black font-black px-6 md:px-8 rounded-xl transition-all touch-feedback disabled:opacity-50 whitespace-nowrap"
                                >
                                    {loading ? '...' : 'DEAL'}
                                </button>
                            </div>
                        ) : (
                            <div className="flex gap-3 md:gap-4">
                                <button 
                                    onClick={hit} 
                                    disabled={loading}
                                    className="flex-1 bg-stake-hover hover:bg-stake-hover/80 text-white py-3 md:py-4 rounded-xl font-bold transition-all border border-white/5 touch-feedback disabled:opacity-50"
                                >
                                    HIT
                                </button>
                                <button 
                                    onClick={stand} 
                                    disabled={loading}
                                    className="flex-1 bg-btn-gradient text-black py-3 md:py-4 rounded-xl font-bold shadow-glow transition-all touch-feedback disabled:opacity-50"
                                >
                                    STAND
                                </button>
                            </div>
                        )}
                    </div>
                </div>
            );
        };

        const Mines = ({ user, updateBalance }) => {
            const [state, setState] = useState({ bet: 10, mineCount: 3, revealed: Array(25).fill(false), mines: [], active: false, multiplier: 1.0 });
            const [isShaking, setIsShaking] = useState(false);
            const [loading, setLoading] = useState(false);

            const startGame = async () => {
                if (state.bet * 100 > user.balance) return alert("Insufficient funds");
                setLoading(true);
                try {
                    const res = await minesApi.start(user.username, state.bet * 100, state.mineCount);
                    updateBalance(res.newBalance);
                    setState({ ...state, active: true, revealed: Array(25).fill(false), mines: [], multiplier: 1.0 });
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };

            const clickTile = async (index) => {
                if (!state.active || state.revealed[index] || loading) return;
                setLoading(true);
                try {
                    const res = await minesApi.reveal(user.username, index);
                    const newRevealed = [...state.revealed]; newRevealed[index] = true;
                    if (res.hit === 'mine') {
                        setIsShaking(true);
                        setState({ ...state, active: false, revealed: Array(25).fill(true), mines: res.mines });
                        setTimeout(() => setIsShaking(false), 500);
                    } else {
                        setState({ ...state, revealed: newRevealed, multiplier: res.multiplier });
                    }
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };

            const cashout = async () => {
                setLoading(true);
                try {
                    const res = await minesApi.cashout(user.username);
                    updateBalance(res.newBalance);
                    setState({ ...state, active: false, revealed: Array(25).fill(true), mines: res.mines });
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };

            return (
                <div className="flex flex-col gap-4 md:gap-8 w-full max-w-6xl mx-auto p-4 pb-24 md:pb-4">
                    <div className="w-full glass p-4 md:p-6 rounded-2xl border border-white/5 flex flex-col gap-4 md:gap-6">
                        <div className="grid grid-cols-2 gap-4">
                            <div>
                                <label className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-2 block">Bet Amount</label>
                                <input type="number" value={state.bet} onChange={e => setState({ ...state, bet: Number(e.target.value) })} disabled={state.active} className="w-full input-field rounded-xl p-3 text-white font-mono font-bold" />
                            </div>
                            <div>
                                <label className="text-gray-400 text-xs font-bold uppercase tracking-wider mb-2 block">Mines</label>
                                <select value={state.mineCount} onChange={e => setState({ ...state, mineCount: Number(e.target.value) })} disabled={state.active} className="w-full input-field rounded-xl p-3 text-white font-bold cursor-pointer">
                                    {[1, 2, 3, 4, 5, 10, 15, 20, 24].map(n => <option key={n} value={n}>{n}</option>)}
                                </select>
                            </div>
                        </div>
                        {state.active ? (
                            <>
                                <div className="bg-black/30 p-4 rounded-xl border border-white/5">
                                    <div className="text-gray-400 text-xs font-bold uppercase mb-1">Current Multiplier</div>
                                    <div className="text-stake-green text-3xl md:text-4xl font-black font-mono tracking-tighter drop-shadow-md">{state.multiplier.toFixed(2)}x</div>
                                </div>
                                <button onClick={cashout} disabled={loading} className="w-full bg-btn-gradient text-black font-black py-3 md:py-4 rounded-xl shadow-glow transition-all touch-feedback disabled:opacity-50">
                                    CASHOUT ${(state.bet * state.multiplier).toFixed(2)}
                                </button>
                            </>

        const Coinflip = ({ user, updateBalance }) => {

        const Plinko = ({ user, updateBalance }) => {
            const [bet, setBet] = useState(10);
            const [balls, setBalls] = useState([]);
            const [loading, setLoading] = useState(false);
            const lastId = useRef(0);
            const multipliers = [19.6, 7.84, 3.92, 1.96, 0.49, 0.29, 0.29, 0.29, 0.49, 1.96, 3.92, 7.84, 19.6];
            
            const drop = async () => {
                if (bet * 100 > user.balance) return alert("Insufficient funds");
                setLoading(true);
                try {
                    const res = await plinkoApi.drop(user.username, bet * 100, 'medium');
                    updateBalance(res.newBalance);
                    
                    const rows = 12;
                    const slot = res.slot;
                    const rights = slot;
                    const lefts = rows - rights;
                    const path = Array(lefts).fill(0).concat(Array(rights).fill(1));
                    for (let i = path.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [path[i], path[j]] = [path[j], path[i]];
                    }
                    
                    setBalls(p => [...p, { id: lastId.current++, x: 50, y: 0, path, step: 0, progress: 0 }]);
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };

            useEffect(() => {
                let frame;
                const loop = () => {
                    setBalls(bs => bs.map(b => {
                        let { x, y, step, progress } = b;
                        progress += 0.05;
                        if (progress >= 1) { progress = 0; step++; }
                        y = (step + progress) * (100 / 13);
                        if (step < b.path.length) {
                             const idx = b.path.slice(0, step).reduce((a,c) => a+c, 0);
                             const nextIdx = idx + b.path[step];
                             const startX = 50 + (idx - step/2) * (80/12);
                             const endX = 50 + (nextIdx - (step+1)/2) * (80/12);
                             x = startX + (endX - startX) * progress;
                        }
                        return { ...b, x, y, step, progress };
                    }).filter(b => b.step <= 12));
                    frame = requestAnimationFrame(loop);
                };
                loop();
                return () => cancelAnimationFrame(frame);
            }, []);

            return (
                <div className="flex gap-4 md:gap-8 max-w-6xl mx-auto p-4 flex-col pb-24 md:pb-4">

                            <button onClick={drop} disabled={loading} className="px-6 md:px-8 bg-btn-gradient text-black font-black rounded-xl shadow-glow transition-all touch-feedback disabled:opacity-50 whitespace-nowrap">
                                {loading ? '...' : 'DROP'}
                            </button>
                        </div>
                    </div>
                    <div className="glass rounded-2xl border border-white/5 relative h-[400px] md:h-[600px] overflow-hidden bg-black/20">
                        <div className="absolute inset-0 flex flex-col justify-between py-6 md:py-12 px-2 md:px-4">
                             {Array.from({ length: 13 }).map((_, r) => <div key={r} className="flex justify-center gap-2 md:gap-4">{Array.from({ length: r + 3 }).map((_, c) => <div key={c} className="w-1.5 h-1.5 md:w-2 md:h-2 rounded-full bg-white/30 shadow-[0_0_5px_rgba(255,255,255,0.2)]"></div>)}</div>)}
                        </div>
                        <div className="absolute bottom-2 w-full flex justify-between px-2 md:px-4 gap-1 md:gap-2">
                            {multipliers.map((m, i) => {
                                let bg = 'bg-[#0f212e]';
                                if (m >= 10) bg = 'bg-red-500 shadow-glow-red';
                                else if (m >= 2) bg = 'bg-orange-500';
                                else bg = 'bg-stake-green text-black';
                                return <div key={i} className={`flex-1 h-6 md:h-8 rounded-md flex items-center justify-center text-[8px] md:text-[10px] font-bold ${bg} shadow-lg transition-transform`}>{m}x</div>
                            })}
                        </div>
                        {balls.map(b => <div key={b.id} className="absolute w-3 h-3 md:w-4 md:h-4 rounded-full bg-white shadow-[0_0_15px_rgba(255,255,255,0.8)] z-10" style={{ left: `${b.x}%`, top: `${b.y}%`, transform: 'translate(-50%,-50%)' }}></div>)}
                    </div>
                </div>
            );
        };

        const Towers = ({ user, updateBalance }) => {
            const [state, setState] = useState({ bet: 10, difficulty: 'medium', active: false, row: 0, revealed: Array(8).fill(-1), multiplier: 1.0, safeTiles: [] });
            const [loading, setLoading] = useState(false);

                    </div>
                    <div className="glass rounded-2xl border border-white/5 p-4 md:p-8 flex flex-col-reverse items-center justify-center gap-2 md:gap-3 min-h-[400px]">
                        {Array.from({ length: 8 }).map((_, r) => (
                            <div key={r} className={`grid grid-cols-3 gap-2 md:gap-4 ${state.row === r && state.active ? 'opacity-100 scale-105' : 'opacity-40 grayscale'}`}>
                                {[0, 1, 2].map(c => {
                                    const picked = state.revealed[r] === c;
                                    const isSafe = state.safeTiles.includes(c);
                                    const isBomb = picked && !isSafe && !state.active;
                                    return <button key={c} disabled={!(state.row === r && state.active) || loading} onClick={() => pick(c)} className={`w-20 h-12 md:w-24 md:h-16 rounded-xl flex items-center justify-center font-bold text-2xl md:text-3xl transition-all shadow-lg touch-feedback no-select ${picked ? (isBomb ? 'bg-red-500/20 border-2 border-red-500 shadow-glow-red' : 'bg-stake-green text-black shadow-glow') : 'bg-stake-card border border-white/5'}`}>{picked && (isBomb ? '💣' : '💎')}</button>;
                                })}

        };

        const Roulette = ({ user, updateBalance }) => {

            const [spinning, setSpinning] = useState(false);
            
            const placeBet = (k) => !spinning && setBets(p => ({ ...p, [k]: (p[k] || 0) + betAmount }));
            
            const spin = async () => {

                if (totalBet * 100 > user.balance) return alert("Insufficient funds");

                        <div className="flex gap-3 md:gap-4 w-full max-w-lg">
                            <button disabled={!state.active || loading} onClick={() => guess('lower')} className="flex-1 bg-[#1a2c38] border border-white/10 p-4 md:p-6 rounded-2xl disabled:opacity-50 transition-all touch-feedback">
                                <div className="text-gray-400 font-bold text-xs md:text-sm uppercase mb-1">Lower</div>
                                <div className="text-white font-black text-lg md:text-2xl">{state.odds?.low}x</div>
                            </button>
                            <button disabled={!state.active || loading} onClick={() => guess('higher')} className="flex-1 bg-[#1a2c38] border border-white/10 p-4 md:p-6 rounded-2xl disabled:opacity-50 transition-all touch-feedback">
                                <div className="text-gray-400 font-bold text-xs md:text-sm uppercase mb-1">Higher</div>
                                <div className="text-white font-black text-lg md:text-2xl">{state.odds?.high}x</div>
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        // ==========================================
        // MAIN APP COMPONENT
        // ==========================================

        const App = () => {
            const [user, setUser] = useState(null);
            const [activeGame, setActiveGame] = useState(null);
            const [showMobileMenu, setShowMobileMenu] = useState(false);
            const [loginUser, setLoginUser] = useState('');
            const [loginPass, setLoginPass] = useState('');
            const [loading, setLoading] = useState(false);

            const handleLogin = async (reg) => {
                setLoading(true);
                try {
                    const res = reg ? await authApi.register(loginUser, loginPass) : await authApi.login(loginUser, loginPass);
                    setUser({ username: res.username, balance: res.balance, isDemo: res.isDemo || false });
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };

            const handleDemoLogin = async () => {
                setLoading(true);
                try {
                    const res = await authApi.demoLogin();
                    setUser({ username: res.username, balance: res.balance, isDemo: true });
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };

            const updateBalance = useCallback((newBalance) => {
                setUser(prev => ({ ...prev, balance: newBalance }));
            }, []);

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-aura-gradient">
                    <div className="glass p-6 md:p-10 rounded-3xl border border-white/10 w-full max-w-md shadow-2xl relative overflow-hidden animate-pop-in">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-stake-green to-transparent"></div>
                        <div className="text-center mb-8 md:mb-10">
                            <h1 className="text-4xl md:text-5xl font-black text-white mb-2 tracking-tight"><span className="text-stake-green drop-shadow-[0_0_10px_rgba(0,231,1,0.5)]">JUD</span>ECENO</h1>
                            <p className="text-gray-400 font-medium tracking-wide text-sm md:text-base">PREMIUM CRYPTO CASINO</p>
                        </div>
                        <div className="space-y-3 md:space-y-4">
                            <input placeholder="Username" value={loginUser} onChange={e => setLoginUser(e.target.value)} className="w-full input-field rounded-xl p-3 md:p-4 text-white text-base md:text-lg" />
                            <input type="password" placeholder="Password" value={loginPass} onChange={e => setLoginPass(e.target.value)} className="w-full input-field rounded-xl p-3 md:p-4 text-white text-base md:text-lg" />
                            <button onClick={() => handleLogin(false)} disabled={loading} className="w-full bg-btn-gradient text-black font-black py-3 md:py-4 rounded-xl text-base md:text-lg hover:shadow-glow transition-all touch-feedback disabled:opacity-50">
                                {loading ? 'LOADING...' : 'LOGIN'}
                            </button>
                            <button onClick={() => handleLogin(true)} disabled={loading} className="w-full bg-white/5 text-gray-300 font-bold py-3 md:py-4 rounded-xl transition-all border border-white/5 touch-feedback disabled:opacity-50">CREATE ACCOUNT</button>
                            
                            <div className="relative my-4 md:my-6">
                                <div className="absolute inset-0 flex items-center">
                                    <div className="w-full border-t border-white/10"></div>
                                </div>
                                <div className="relative flex justify-center text-sm">
                                    <span className="px-4 bg-stake-card text-gray-400 font-medium">OR</span>
                                </div>
                            </div>
                            
                            <button onClick={handleDemoLogin} disabled={loading} className="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-black font-black py-3 md:py-4 rounded-xl hover:shadow-[0_0_20px_rgba(251,191,36,0.4)] transition-all touch-feedback flex items-center justify-center gap-2 disabled:opacity-50">
                                <span>🎮</span>
                                TRY DEMO MODE
                                <span className="text-xs font-normal">(Free $100)</span>
                            </button>
                        </div>
                    </div>
                </div>
            );

            const GameCard = ({ id, name, icon, gradient }) => (
                <button onClick={() => setActiveGame(id)} className="group relative rounded-2xl overflow-hidden aspect-[4/3] shadow-lg hover:shadow-glow-card transition-all hover:-translate-y-2 bg-stake-card border border-white/5 touch-feedback">
                    <div className={`absolute inset-0 bg-gradient-to-br ${gradient} opacity-10 group-hover:opacity-20 transition-opacity`}></div>
                    <div className="absolute inset-0 flex flex-col items-center justify-center p-4 md:p-6">
                        <div className="text-4xl md:text-6xl mb-4 md:mb-6 transform group-hover:scale-110 group-hover:rotate-3 transition-transform duration-300 drop-shadow-2xl">{icon}</div>
                        <div className="font-black text-lg md:text-2xl text-white tracking-wide uppercase">{name}</div>
                    </div>
                    <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[2px]">
                        <span className="bg-btn-gradient text-black font-black px-6 md:px-8 py-2 md:py-3 rounded-full transform scale-90 group-hover:scale-100 transition-transform shadow-glow">PLAY</span>
                    </div>
                </button>
            );

            return (
                <div className="min-h-screen text-stake-text font-sans">
                    <TopBar user={user} onLogout={() => setUser(null)} />
                    
                    <main className="pt-20 md:pt-24 px-4 pb-20 md:pb-6 smooth-scroll">
                        <div className="max-w-[1600px] mx-auto min-h-[calc(100vh-8rem)]">
                            {activeGame ? (
                                <div>
                                    <div className="mb-4 md:mb-8 flex items-center gap-2 md:gap-3 text-xs md:text-sm text-gray-400 font-medium">
                                        <button className="hover:text-white transition-colors touch-feedback" onClick={() => setActiveGame(null)}>Home</button>
                                        <span className="text-white/20">/</span>
                                        <span className="text-white font-bold capitalize">{activeGame}</span>
                                    </div>
                                    {activeGame === 'blackjack' && <Blackjack user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'mines' && <Mines user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'coinflip' && <Coinflip user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'plinko' && <Plinko user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'towers' && <Towers user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'roulette' && <Roulette user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'hilo' && <HiLo user={user} updateBalance={updateBalance} />}
                                </div>
                            ) : (
                                <div>
                                    <div className="flex items-center gap-3 md:gap-4 mb-6 md:mb-8">
                                        <div className="w-1 md:w-1.5 h-6 md:h-8 bg-stake-green rounded-full shadow-glow"></div>
                                        <h2 className="text-2xl md:text-3xl font-black text-white tracking-tight">Lobby</h2>
                                        {user.isDemo && (
                                            <div className="demo-badge text-black font-bold text-xs px-3 py-1.5 rounded-full shadow-lg hidden md:block">
                                                🎮 DEMO MODE - Playing with Free Credits
                                            </div>
                                        )}
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-8">
                                        <GameCard id="mines" name="Mines" icon="💣" gradient="from-yellow-500 to-red-600" />
                                        <GameCard id="blackjack" name="Blackjack" icon="🃏" gradient="from-purple-600 to-blue-600" />
                                        <GameCard id="plinko" name="Plinko" icon="🎯" gradient="from-pink-500 to-rose-600" />
                                        <GameCard id="roulette" name="Roulette" icon="🎡" gradient="from-green-500 to-emerald-700" />
                                        <GameCard id="towers" name="Towers" icon="🏢" gradient="from-orange-500 to-amber-600" />
                                        <GameCard id="hilo" name="HiLo" icon="📈" gradient="from-blue-400 to-indigo-700" />
                                        <GameCard id="coinflip" name="Coin Flip" icon="🪙" gradient="from-yellow-400 to-yellow-600" />
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    <MobileBottomNav 
                        activeGame={activeGame} 
                        onSelectGame={setActiveGame}
                        onShowMenu={() => setShowMobileMenu(true)}
                    />

                    {showMobileMenu && (
                        <MobileGameMenu 
                            onClose={() => setShowMobileMenu(false)}
                            onSelectGame={setActiveGame}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
