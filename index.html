<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#0f212e">
    <title>Judeceno Casino - Enhanced Edition</title>
    
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel for JSX/TSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              stake: {
                dark: '#0f212e',
                darker: '#07151e',
                card: '#1a2c38',
                hover: '#2f4553',
                green: '#00e701',
                greenHover: '#00c701',
                accent: '#00e701',
                text: '#b1bad3',
                white: '#ffffff',
                red: '#ff4d4d',
                purple: '#9333ea',
                blue: '#3b82f6',
              }
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
            },
            boxShadow: {
              'glow': '0 0 15px rgba(0, 231, 1, 0.4)',
              'glow-red': '0 0 15px rgba(255, 77, 77, 0.4)',
              'glow-purple': '0 0 15px rgba(147, 51, 234, 0.4)',
              'glow-card': '0 0 20px rgba(0,0,0,0.5)',
              'inner-light': 'inset 0 1px 0 rgba(255,255,255,0.1)'
            },
            backgroundImage: {
              'aura-gradient': 'radial-gradient(circle at 50% 0%, #1a2c38 0%, #0f212e 100%)',
              'card-gradient': 'linear-gradient(145deg, #1a2c38, #15232d)',
              'btn-gradient': 'linear-gradient(to bottom, #00e701, #00c701)'
            }
          }
        }
      }
    </script>
    
    <!-- Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    
    <style>
      * {
        -webkit-tap-highlight-color: transparent;
        -webkit-touch-callout: none;
      }
      
      body {
        font-family: 'Inter', sans-serif;
        background-color: #0f212e;
        background-image: radial-gradient(circle at 50% -20%, #213743 0%, #0f212e 50%, #07151e 100%);
        background-attachment: fixed;
        color: #b1bad3;
        overscroll-behavior: none;
        -webkit-overflow-scrolling: touch;
      }
      
      ::-webkit-scrollbar { width: 4px; height: 4px; }
      ::-webkit-scrollbar-track { background: transparent; }
      ::-webkit-scrollbar-thumb { background: #2f4553; border-radius: 99px; }
      ::-webkit-scrollbar-thumb:hover { background: #415969; }

      @keyframes pop-in {
        0% { transform: scale(0.9) translateY(10px); opacity: 0; }
        100% { transform: scale(1) translateY(0); opacity: 1; }
      }
      .animate-pop-in { animation: pop-in 0.3s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }

      @keyframes shake {
        0%, 100% { transform: translateX(0); }
        10%, 30%, 50%, 70%, 90% { transform: translateX(-4px); }
        20%, 40%, 60%, 80% { transform: translateX(4px); }
      }
      .animate-shake { animation: shake 0.4s ease-in-out; }

      @keyframes slide-up {
        from { transform: translateY(100%); opacity: 0; }
        to { transform: translateY(0); opacity: 1; }
      }
      .animate-slide-up { animation: slide-up 0.3s ease-out forwards; }

      @keyframes pulse-glow {
        0%, 100% { box-shadow: 0 0 20px rgba(147, 51, 234, 0.4); }
        50% { box-shadow: 0 0 30px rgba(147, 51, 234, 0.6); }
      }
      .animate-pulse-glow { animation: pulse-glow 2s ease-in-out infinite; }

      .perspective-1000 { perspective: 1000px; }
      .transform-style-3d { transform-style: preserve-3d; }
      .backface-hidden { backface-visibility: hidden; }
      .rotate-y-180 { transform: rotateY(180deg); }
      
      .glass {
        background: rgba(26, 44, 56, 0.7);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border: 1px solid rgba(255, 255, 255, 0.05);
      }
      
      .input-field {
        background: #07151e;
        border: 1px solid #2f4553;
        transition: all 0.2s;
        font-size: 16px;
      }
      .input-field:focus {
        border-color: #00e701;
        box-shadow: 0 0 0 2px rgba(0, 231, 1, 0.1);
        outline: none;
      }
      
      .demo-badge {
        background: linear-gradient(135deg, #fbbf24 0%, #f59e0b 100%);
        animation: pulse 2s infinite;
      }
      
      @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.8; }
      }

      @media (max-width: 768px) {
        .mobile-bottom-nav {
          position: fixed;
          bottom: 0;
          left: 0;
          right: 0;
          background: rgba(15, 33, 46, 0.95);
          backdrop-filter: blur(20px);
          border-top: 1px solid rgba(255, 255, 255, 0.05);
          padding: 8px 0 max(8px, env(safe-area-inset-bottom));
          z-index: 100;
        }
        
        .safe-area-bottom {
          padding-bottom: max(1rem, env(safe-area-inset-bottom));
        }
        
        .safe-area-top {
          padding-top: max(1rem, env(safe-area-inset-top));
        }
      }

      .touch-feedback:active {
        transform: scale(0.97);
        opacity: 0.9;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      .spinner {
        border: 3px solid rgba(255, 255, 255, 0.1);
        border-top-color: #00e701;
        border-radius: 50%;
        width: 40px;
        height: 40px;
        animation: spin 0.8s linear infinite;
      }

      .no-select {
        -webkit-user-select: none;
        -moz-user-select: none;
        -ms-user-select: none;
        user-select: none;
      }

      .smooth-scroll {
        scroll-behavior: smooth;
        -webkit-overflow-scrolling: touch;
      }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const API_URL = 'http://localhost:5000';

        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => setDebouncedValue(value), delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        }

        async function apiRequest(endpoint, body = {}, method = 'POST') {
            try {
                const config = {
                    method,
                    headers: { 'Content-Type': 'application/json' }
                };
                if (method !== 'GET' && Object.keys(body).length > 0) {
                    config.body = JSON.stringify(body);
                }
                const res = await fetch(`${API_URL}${endpoint}`, config);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'API Error');
                return data;
            } catch (err) {
                console.error(`API Error [${endpoint}]:`, err);
                throw err;
            }
        }

        const authApi = {
            login: async (u, p) => {
                const res = await apiRequest('/login', { username: u, password: p });
                return { username: res.username, balance: res.balance, isDemo: res.isDemo };
            },
            register: async (u, p) => {
                const res = await apiRequest('/register', { username: u, password: p });
                return { username: res.username, balance: res.balance, isDemo: res.isDemo };
            },
            demoLogin: async () => {
                const res = await apiRequest('/demo-login', {});
                return { username: res.username, balance: res.balance, isDemo: true };
            }
        };

        const blackjackApi = {
            deal: (username, bet) => apiRequest('/blackjack/deal', { username, bet }),
            hit: (username) => apiRequest('/blackjack/hit', { username }),
            stand: (username) => apiRequest('/blackjack/stand', { username })
        };

        const minesApi = {
            start: (username, bet, mineCount) => apiRequest('/mines/start', { username, bet, mineCount }),
            reveal: (username, index) => apiRequest('/mines/reveal', { username, index }),
            cashout: (username) => apiRequest('/mines/cashout', { username })
        };

        const coinflipApi = {
            play: (username, bet, choice) => apiRequest('/coinflip/play', { username, bet, choice })
        };

        const rouletteApi = {
            spin: (username, bet, betType) => apiRequest('/roulette/spin', { username, bet, betType })
        };

        const towersApi = {
            start: (username, bet, difficulty) => apiRequest('/towers/start', { username, bet, difficulty }),
            pick: (username, position) => apiRequest('/towers/pick', { username, position }),
            cashout: (username) => apiRequest('/towers/cashout', { username })
        };

        const plinkoApi = {
            drop: (username, bet, risk) => apiRequest('/plinko/drop', { username, bet, risk })
        };

        const hiloApi = {
            start: (username, bet) => apiRequest('/hilo/start', { username, bet }),
            guess: (username, guess) => apiRequest('/hilo/guess', { username, guess }),
            cashout: (username) => apiRequest('/hilo/cashout', { username })
        };

        const pokerApi = {
            getLobbies: () => apiRequest('/poker/lobbies', {}, 'GET'),
            createTable: (username, buyIn, isDemoMode) => apiRequest('/poker/create-table', { username, buyIn, isDemoMode }),
            joinTable: (username, tableId) => apiRequest('/poker/join-table', { username, tableId }),
            leaveTable: (username, tableId) => apiRequest('/poker/leave-table', { username, tableId }),
            getTable: (tableId) => apiRequest(`/poker/table/${tableId}`, {}, 'GET'),
            bet: (username, tableId, amount) => apiRequest('/poker/bet', { username, tableId, amount }),
            fold: (username, tableId) => apiRequest('/poker/fold', { username, tableId }),
            check: (username, tableId) => apiRequest('/poker/check', { username, tableId }),
            call: (username, tableId) => apiRequest('/poker/call', { username, tableId })
        };

        // ==========================================
        // UI COMPONENTS
        // ==========================================

        const LoadingSpinner = () => (
            <div className="flex items-center justify-center p-8">
                <div className="spinner"></div>
            </div>
        );

        const MobileBottomNav = ({ activeGame, onSelectGame, onShowMenu }) => {
            const games = [
                { id: null, name: 'Home', icon: '🏠' },
                { id: 'poker', name: 'Poker', icon: '🎴' },
                { id: 'mines', name: 'Mines', icon: '💣' },
                { id: 'more', name: 'More', icon: '⋯' },
            ];

            return (
                <div className="mobile-bottom-nav block md:hidden">
                    <div className="flex justify-around items-center">
                        {games.map((game) => (
                            <button
                                key={game.id || 'home'}
                                onClick={() => game.id === 'more' ? onShowMenu() : onSelectGame(game.id)}
                                className={`flex flex-col items-center gap-1 px-4 py-2 transition-all touch-feedback ${
                                    activeGame === game.id ? 'text-stake-green' : 'text-gray-400'
                                }`}
                            >
                                <span className="text-2xl">{game.icon}</span>
                                <span className="text-xs font-medium">{game.name}</span>
                            </button>
                        ))}
                    </div>
                </div>
            );
        };

        const MobileGameMenu = ({ onClose, onSelectGame }) => {
            const allGames = [
                { id: 'poker', name: 'Poker', icon: '🎴' },
                { id: 'mines', name: 'Mines', icon: '💣' },
                { id: 'blackjack', name: 'Blackjack', icon: '🃏' },
                { id: 'plinko', name: 'Plinko', icon: '🎯' },
                { id: 'roulette', name: 'Roulette', icon: '🎡' },
                { id: 'coinflip', name: 'Coin Flip', icon: '🪙' },
                { id: 'towers', name: 'Towers', icon: '🏢' },
                { id: 'hilo', name: 'Hi-Lo', icon: '📊' },
            ];

            return (
                <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm" onClick={onClose}>
                    <div className="fixed bottom-0 left-0 right-0 bg-stake-card rounded-t-3xl p-6 animate-slide-up safe-area-bottom" onClick={e => e.stopPropagation()}>
                        <div className="w-12 h-1 bg-gray-600 rounded-full mx-auto mb-6"></div>
                        <h3 className="text-xl font-bold text-white mb-4">All Games</h3>
                        <div className="grid grid-cols-3 gap-3 max-h-96 overflow-y-auto smooth-scroll">
                            {allGames.map((game) => (
                                <button
                                    key={game.id}
                                    onClick={() => {
                                        onSelectGame(game.id);
                                        onClose();
                                    }}
                                    className="flex flex-col items-center gap-2 p-4 bg-stake-hover rounded-xl touch-feedback transition-all hover:bg-stake-hover/80"
                                >
                                    <span className="text-4xl">{game.icon}</span>
                                    <span className="text-sm font-medium text-white">{game.name}</span>
                                </button>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

        const TopBar = ({ user, onLogout }) => (
            <div className="h-16 glass fixed top-0 w-full z-50 border-b border-white/5 shadow-lg flex items-center justify-between px-4 backdrop-blur-md safe-area-top">
                <div className="flex items-center gap-3">
                    <div className="text-xl md:text-2xl font-black text-white tracking-tight flex items-center gap-1 cursor-pointer" onClick={() => window.location.reload()}>
                        <span className="text-stake-green drop-shadow-[0_0_8px_rgba(0,231,1,0.5)]">JUD</span><span className="hidden sm:inline">ECENO</span>
                    </div>
                </div>
                <div className="flex items-center gap-2 md:gap-4">
                    {user ? (
                        <>
                            {user.isDemo && (
                                <div className="demo-badge text-black font-black text-[10px] md:text-xs px-2 md:px-3 py-1 rounded-full shadow-lg">
                                    DEMO
                                </div>
                            )}
                            <div className="bg-black/40 rounded-full px-3 md:px-5 py-1.5 md:py-2 flex items-center gap-2 border border-white/10 shadow-inner-light">
                                <span className="text-xs md:text-sm font-bold font-mono text-stake-green">${(user.balance / 100).toFixed(2)}</span>
                            </div>
                            <button onClick={onLogout} className="w-8 h-8 md:w-10 md:h-10 bg-gradient-to-br from-stake-hover to-stake-card rounded-full flex items-center justify-center text-white font-bold border border-white/20 shadow-lg touch-feedback">
                                {user.username[0].toUpperCase()}
                            </button>
                        </>
                    ) : null}
                </div>
            </div>
        );

        // ==========================================
        // GAME COMPONENTS
        // ==========================================

        const CardView = ({ card, hidden, small }) => {
            const sizeClass = small ? 'w-16 h-24 text-sm' : 'w-20 h-32 md:w-24 md:h-36';
            
            if (hidden) return (
                <div className={`${sizeClass} bg-stake-card border-2 border-stake-hover rounded-xl flex items-center justify-center shadow-2xl relative overflow-hidden`}>
                     <span className="text-2xl md:text-4xl opacity-50">♠️</span>
                </div>
            );
            if (!card) return null;
            return (
                <div className={`${sizeClass} bg-white rounded-xl flex flex-col items-center justify-center shadow-xl relative overflow-hidden ${card.color === 'red' ? 'text-red-600' : 'text-black'}`}>
                    <div className="absolute top-1 left-1 md:top-2 md:left-2 text-base md:text-xl font-bold leading-none">{card.value}</div>
                    <div className="text-3xl md:text-5xl">{card.suit === 'hearts' ? '♥' : card.suit === 'diamonds' ? '♦' : card.suit === 'clubs' ? '♣' : '♠'}</div>
                    <div className="absolute bottom-1 right-1 md:bottom-2 md:right-2 text-base md:text-xl font-bold leading-none rotate-180">{card.value}</div>
                </div>
            );
        };

        // POKER COMPONENT
        const Poker = ({ user, updateBalance }) => {
            const [lobbies, setLobbies] = useState({ demo: [], real: [] });
            const [selectedTable, setSelectedTable] = useState(null);
            const [tableData, setTableData] = useState(null);
            const [loading, setLoading] = useState(false);
            const [createMode, setCreateMode] = useState(false);
            const [buyIn, setBuyIn] = useState(100);

            const loadLobbies = async () => {
                try {
                    const data = await pokerApi.getLobbies();
                    setLobbies(data);
                } catch (e) {
                    console.error('Failed to load lobbies:', e);
                }
            };

            useEffect(() => {
                loadLobbies();
                const interval = setInterval(loadLobbies, 3000); // Refresh every 3s
                return () => clearInterval(interval);
            }, []);

            useEffect(() => {
                if (selectedTable) {
                    const loadTable = async () => {
                        try {
                            const data = await pokerApi.getTable(selectedTable);
                            setTableData(data);
                        } catch (e) {
                            console.error('Failed to load table:', e);
                        }
                    };
                    loadTable();
                    const interval = setInterval(loadTable, 2000);
                    return () => clearInterval(interval);
                }
            }, [selectedTable]);

            const createTable = async () => {
                setLoading(true);
                try {
                    const res = await pokerApi.createTable(user.username, buyIn * 100, user.isDemo);
                    updateBalance(res.newBalance);
                    setSelectedTable(res.tableId);
                    setCreateMode(false);
                } catch (e) {
                    alert(e.message);
                } finally {
                    setLoading(false);
                }
            };

            const joinTable = async (tableId) => {
                setLoading(true);
                try {
                    const res = await pokerApi.joinTable(user.username, tableId);
                    updateBalance(res.newBalance);
                    setSelectedTable(tableId);
                } catch (e) {
                    alert(e.message);
                } finally {
                    setLoading(false);
                }
            };

            const leaveTable = async () => {
                setLoading(true);
                try {
                    const res = await pokerApi.leaveTable(user.username, selectedTable);
                    updateBalance(res.newBalance);
                    setSelectedTable(null);
                    setTableData(null);
                } catch (e) {
                    alert(e.message);
                } finally {
                    setLoading(false);
                }
            };

            const performAction = async (action, amount = null) => {
                setLoading(true);
                try {
                    let res;
                    if (action === 'bet') res = await pokerApi.bet(user.username, selectedTable, amount);
                    else if (action === 'fold') res = await pokerApi.fold(user.username, selectedTable);
                    else if (action === 'check') res = await pokerApi.check(user.username, selectedTable);
                    else if (action === 'call') res = await pokerApi.call(user.username, selectedTable);
                    
                    if (res.newBalance !== undefined) updateBalance(res.newBalance);
                } catch (e) {
                    alert(e.message);
                } finally {
                    setLoading(false);
                }
            };

            if (selectedTable && tableData) {
                const myPlayer = tableData.players.find(p => p.username === user.username);
                const isMyTurn = tableData.currentPlayer === user.username;

                return (
                    <div className="flex flex-col gap-4 md:gap-8 w-full max-w-6xl mx-auto p-4 pb-24 md:pb-4">
                        <button onClick={leaveTable} className="self-start px-4 py-2 bg-stake-red text-white rounded-lg font-bold touch-feedback">
                            ← Leave Table
                        </button>

                        <div className="glass rounded-2xl p-6 md:p-8 border border-white/5">
                            <div className="text-center mb-6">
                                <div className="text-gray-400 text-sm mb-2">POT</div>
                                <div className="text-stake-green text-4xl font-black font-mono">${(tableData.pot / 100).toFixed(2)}</div>
                            </div>

                            {/* Community Cards */}
                            {tableData.communityCards && tableData.communityCards.length > 0 && (
                                <div className="flex gap-2 justify-center mb-6 flex-wrap">
                                    {tableData.communityCards.map((card, i) => (
                                        <div key={i} className="animate-pop-in" style={{animationDelay: `${i*0.1}s`}}>
                                            <CardView card={card} small={window.innerWidth < 768} />
                                        </div>
                                    ))}
                                </div>
                            )}

                            {/* Players */}
                            <div className="grid grid-cols-2 md:grid-cols-4 gap-4 mb-6">
                                {tableData.players.map((player, i) => (
                                    <div key={i} className={`glass p-4 rounded-xl border ${player.username === tableData.currentPlayer ? 'border-stake-green' : 'border-white/5'}`}>
                                        <div className="font-bold text-white mb-1">{player.username}</div>
                                        <div className="text-sm text-gray-400">${(player.chips / 100).toFixed(2)}</div>
                                        {player.hasFolded && <div className="text-xs text-red-500 mt-1">FOLDED</div>}
                                        {player.currentBet > 0 && <div className="text-xs text-stake-green mt-1">Bet: ${(player.currentBet / 100).toFixed(2)}</div>}
                                    </div>
                                ))}
                            </div>

                            {/* Your Hand */}
                            {myPlayer && myPlayer.hand && (
                                <div className="mb-6">
                                    <div className="text-center text-gray-400 text-sm mb-2">Your Hand</div>
                                    <div className="flex gap-2 justify-center">
                                        {myPlayer.hand.map((card, i) => (
                                            <CardView key={i} card={card} small={window.innerWidth < 768} />
                                        ))}
                                    </div>
                                </div>
                            )}

                            {/* Actions */}
                            {isMyTurn && myPlayer && !myPlayer.hasFolded && (
                                <div className="grid grid-cols-2 md:grid-cols-4 gap-3">
                                    <button onClick={() => performAction('fold')} disabled={loading} className="bg-red-500 text-white py-3 rounded-xl font-bold touch-feedback disabled:opacity-50">FOLD</button>
                                    <button onClick={() => performAction('check')} disabled={loading} className="bg-gray-600 text-white py-3 rounded-xl font-bold touch-feedback disabled:opacity-50">CHECK</button>
                                    <button onClick={() => performAction('call')} disabled={loading} className="bg-blue-500 text-white py-3 rounded-xl font-bold touch-feedback disabled:opacity-50">CALL</button>
                                    <button onClick={() => performAction('bet', 10)} disabled={loading} className="bg-stake-green text-black py-3 rounded-xl font-bold touch-feedback disabled:opacity-50">BET $10</button>
                                </div>
                            )}

                            {tableData.gameState === 'waiting' && (
                                <div className="text-center text-gray-400 mt-4">Waiting for players...</div>
                            )}
                        </div>
                    </div>
                );
            }

            const currentLobbies = user.isDemo ? lobbies.demo : lobbies.real;

            return (
                <div className="flex flex-col gap-4 md:gap-8 w-full max-w-6xl mx-auto p-4 pb-24 md:pb-4">
                    <div className="flex items-center justify-between">
                        <h2 className="text-2xl font-black text-white">
                            {user.isDemo ? '🎮 Demo Poker Lobbies' : '💰 Real Money Poker'}
                        </h2>
                        <button onClick={() => setCreateMode(!createMode)} className="px-4 py-2 bg-btn-gradient text-black font-bold rounded-xl touch-feedback">
                            {createMode ? 'Cancel' : '+ New Table'}
                        </button>
                    </div>

                    {createMode && (
                        <div className="glass p-6 rounded-2xl border border-white/5 animate-pop-in">
                            <h3 className="text-xl font-bold text-white mb-4">Create New Table</h3>
                            <div className="mb-4">
                                <label className="text-gray-400 text-sm mb-2 block">Buy-in Amount</label>
                                <input type="number" value={buyIn} onChange={e => setBuyIn(Number(e.target.value))} className="w-full input-field rounded-xl p-3 text-white font-mono font-bold" />
                            </div>
                            <button onClick={createTable} disabled={loading} className="w-full bg-btn-gradient text-black font-black py-4 rounded-xl shadow-glow touch-feedback disabled:opacity-50">

            const [balls, setBalls] = useState([]);
            const [loading, setLoading] = useState(false);
            const lastId = useRef(0);
            
            const multipliers = {
                low: [5.6, 2.1, 1.1, 1.0, 0.5, 0.3, 0.3, 0.3, 0.5, 1.0, 1.1, 2.1, 5.6],
                medium: [13, 3, 1.3, 0.7, 0.4, 0.2, 0.2, 0.2, 0.4, 0.7, 1.3, 3, 13],

            };
            
            const currentMultipliers = multipliers[risk];
            
            const drop = async () => {
                if (bet * 100 > user.balance) return alert("Insufficient funds");
                setLoading(true);
                try {
                    const res = await plinkoApi.drop(user.username, bet * 100, risk);
                    updateBalance(res.newBalance);
                    
                    const rows = 12;
                    const slot = res.slot;
                    const rights = slot;
                    const lefts = rows - rights;
                    const path = Array(lefts).fill(0).concat(Array(rights).fill(1));
                    for (let i = path.length - 1; i > 0; i--) {
                        const j = Math.floor(Math.random() * (i + 1));
                        [path[i], path[j]] = [path[j], path[i]];
                    }
                    
                    setBalls(p => [...p, { id: lastId.current++, x: 50, y: 0, path, step: 0, progress: 0 }]);
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };

                let frame;
                const loop = () => {
                    setBalls(bs => bs.map(b => {
                        let { x, y, step, progress } = b;
                        progress += 0.05;
                        if (progress >= 1) { progress = 0; step++; }
                        y = (step + progress) * (100 / 13);
                        if (step < b.path.length) {
                             const idx = b.path.slice(0, step).reduce((a,c) => a+c, 0);
                             const nextIdx = idx + b.path[step];
                             const startX = 50 + (idx - step/2) * (80/12);
                             const endX = 50 + (nextIdx - (step+1)/2) * (80/12);
                             x = startX + (endX - startX) * progress;
                        }
                        return { ...b, x, y, step, progress };
                    }).filter(b => b.step <= 12));
                    frame = requestAnimationFrame(loop);
                };
                loop();
                return () => cancelAnimationFrame(frame);

                    setUser({ username: res.username, balance: res.balance, isDemo: true });
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };

            const updateBalance = useCallback((newBalance) => {
                setUser(prev => ({ ...prev, balance: newBalance }));
            }, []);

            if (!user) return (
                <div className="min-h-screen flex items-center justify-center p-4 bg-aura-gradient">
                    <div className="glass p-6 md:p-10 rounded-3xl border border-white/10 w-full max-w-md shadow-2xl relative overflow-hidden animate-pop-in">
                        <div className="absolute top-0 left-0 w-full h-1 bg-gradient-to-r from-transparent via-stake-green to-transparent"></div>
                        <div className="text-center mb-8 md:mb-10">
                            <h1 className="text-4xl md:text-5xl font-black text-white mb-2 tracking-tight"><span className="text-stake-green drop-shadow-[0_0_10px_rgba(0,231,1,0.5)]">JUD</span>ECENO</h1>
                            <p className="text-gray-400 font-medium tracking-wide text-sm md:text-base">PREMIUM CRYPTO CASINO</p>
                        </div>
                        <div className="space-y-3 md:space-y-4">
                            <input placeholder="Username" value={loginUser} onChange={e => setLoginUser(e.target.value)} className="w-full input-field rounded-xl p-3 md:p-4 text-white text-base md:text-lg" />
                            <input type="password" placeholder="Password" value={loginPass} onChange={e => setLoginPass(e.target.value)} className="w-full input-field rounded-xl p-3 md:p-4 text-white text-base md:text-lg" />
                            <button onClick={() => handleLogin(false)} disabled={loading} className="w-full bg-btn-gradient text-black font-black py-3 md:py-4 rounded-xl text-base md:text-lg hover:shadow-glow transition-all touch-feedback disabled:opacity-50">
                                {loading ? 'LOADING...' : 'LOGIN'}
                            </button>
                            <button onClick={() => handleLogin(true)} disabled={loading} className="w-full bg-white/5 text-gray-300 font-bold py-3 md:py-4 rounded-xl transition-all border border-white/5 touch-feedback disabled:opacity-50">CREATE ACCOUNT</button>
                            
                            <div className="relative my-4 md:my-6">
                                <div className="absolute inset-0 flex items-center">
                                    <div className="w-full border-t border-white/10"></div>
                                </div>
                                <div className="relative flex justify-center text-sm">
                                    <span className="px-4 bg-stake-card text-gray-400 font-medium">OR</span>
                                </div>
                            </div>
                            
                            <button onClick={handleDemoLogin} disabled={loading} className="w-full bg-gradient-to-r from-yellow-400 to-orange-500 text-black font-black py-3 md:py-4 rounded-xl hover:shadow-[0_0_20px_rgba(251,191,36,0.4)] transition-all touch-feedback flex items-center justify-center gap-2 disabled:opacity-50">
                                <span>🎮</span>
                                TRY DEMO MODE
                                <span className="text-xs font-normal">(Free $100)</span>
                            </button>
                        </div>
                    </div>
                </div>
            );

            const GameCard = ({ id, name, icon, gradient }) => (
                <button onClick={() => setActiveGame(id)} className="group relative rounded-2xl overflow-hidden aspect-[4/3] shadow-lg hover:shadow-glow-card transition-all hover:-translate-y-2 bg-stake-card border border-white/5 touch-feedback">
                    <div className={`absolute inset-0 bg-gradient-to-br ${gradient} opacity-10 group-hover:opacity-20 transition-opacity`}></div>
                    <div className="absolute inset-0 flex flex-col items-center justify-center p-4 md:p-6">
                        <div className="text-4xl md:text-6xl mb-4 md:mb-6 transform group-hover:scale-110 group-hover:rotate-3 transition-transform duration-300 drop-shadow-2xl">{icon}</div>
                        <div className="font-black text-lg md:text-2xl text-white tracking-wide uppercase">{name}</div>
                    </div>
                    <div className="absolute inset-0 bg-black/60 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-[2px]">
                        <span className="bg-btn-gradient text-black font-black px-6 md:px-8 py-2 md:py-3 rounded-full transform scale-90 group-hover:scale-100 transition-transform shadow-glow">PLAY</span>
                    </div>
                </button>
            );

            return (
                <div className="min-h-screen text-stake-text font-sans">
                    <TopBar user={user} onLogout={() => setUser(null)} />
                    
                    <main className="pt-20 md:pt-24 px-4 pb-20 md:pb-6 smooth-scroll">
                        <div className="max-w-[1600px] mx-auto min-h-[calc(100vh-8rem)]">
                            {activeGame ? (
                                <div>
                                    <div className="mb-4 md:mb-8 flex items-center gap-2 md:gap-3 text-xs md:text-sm text-gray-400 font-medium">
                                        <button className="hover:text-white transition-colors touch-feedback" onClick={() => setActiveGame(null)}>Home</button>
                                        <span className="text-white/20">/</span>
                                        <span className="text-white font-bold capitalize">{activeGame}</span>
                                    </div>
                                    {activeGame === 'poker' && <Poker user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'blackjack' && <Blackjack user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'mines' && <Mines user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'plinko' && <Plinko user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'towers' && <Towers user={user} updateBalance={updateBalance} />}
                                </div>
                            ) : (
                                <div>
                                    <div className="flex items-center gap-3 md:gap-4 mb-6 md:mb-8">
                                        <div className="w-1 md:w-1.5 h-6 md:h-8 bg-stake-green rounded-full shadow-glow"></div>
                                        <h2 className="text-2xl md:text-3xl font-black text-white tracking-tight">Lobby</h2>
                                        {user.isDemo && (
                                            <div className="demo-badge text-black font-bold text-xs px-3 py-1.5 rounded-full shadow-lg hidden md:block">
                                                🎮 DEMO MODE - Playing with Free Credits
                                            </div>
                                        )}
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-3 md:gap-8">
                                        <GameCard id="poker" name="Poker" icon="🎴" gradient="from-purple-600 to-indigo-700" />
                                        <GameCard id="mines" name="Mines" icon="💣" gradient="from-yellow-500 to-red-600" />
                                        <GameCard id="blackjack" name="Blackjack" icon="🃏" gradient="from-purple-600 to-blue-600" />
                                        <GameCard id="plinko" name="Plinko" icon="🎯" gradient="from-pink-500 to-rose-600" />
                                        <GameCard id="towers" name="Towers" icon="🏢" gradient="from-orange-500 to-amber-600" />
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    <MobileBottomNav 
                        activeGame={activeGame} 
                        onSelectGame={setActiveGame}
                        onShowMenu={() => setShowMobileMenu(true)}
                    />

                    {showMobileMenu && (
                        <MobileGameMenu 
                            onClose={() => setShowMobileMenu(false)}
                            onSelectGame={setActiveGame}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
