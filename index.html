<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo, useCallback } = React;

        const API_URL = 'https://margin-formed-qld-packard.trycloudflare.com';

        function useDebounce(value, delay) {
            const [debouncedValue, setDebouncedValue] = useState(value);
            useEffect(() => {
                const handler = setTimeout(() => setDebouncedValue(value), delay);
                return () => clearTimeout(handler);
            }, [value, delay]);
            return debouncedValue;
        }

        async function apiRequest(endpoint, body = {}, method = 'POST') {
            try {
                const config = {
                    method,
                    headers: { 'Content-Type': 'application/json' }
                };
                if (method !== 'GET' && Object.keys(body).length > 0) {
                    config.body = JSON.stringify(body);
                }
                const res = await fetch(`${API_URL}${endpoint}`, config);
                const data = await res.json();
                if (!res.ok) throw new Error(data.error || 'API Error');
                return data;
            } catch (err) {
                console.error(`API Error [${endpoint}]:`, err);
                throw err;
            }
        }

        const authApi = {
            login: async (u, p) => {
                const res = await apiRequest('/login', { username: u, password: p });
                return { username: res.username, balance: res.balance, isDemo: res.isDemo };
            },
            register: async (u, p) => {
                const res = await apiRequest('/register', { username: u, password: p });
                return { username: res.username, balance: res.balance, isDemo: res.isDemo };
            },
            demoLogin: async () => {
                const res = await apiRequest('/demo-login', {});
                return { username: res.username, balance: res.balance, isDemo: true };
            }
        };

        const blackjackApi = {
            deal: (username, bet) => apiRequest('/blackjack/deal', { username, bet }),
            hit: (username) => apiRequest('/blackjack/hit', { username }),
            stand: (username) => apiRequest('/blackjack/stand', { username })
        };

        const minesApi = {
            start: (username, bet, mineCount) => apiRequest('/mines/start', { username, bet, mineCount }),
            reveal: (username, index) => apiRequest('/mines/reveal', { username, index }),
            cashout: (username) => apiRequest('/mines/cashout', { username })
        };

        const coinflipApi = {
            play: (username, bet, choice) => apiRequest('/coinflip/play', { username, bet, choice })
        };

        const rouletteApi = {
            spin: (username, bet, betType) => apiRequest('/roulette/spin', { username, bet, betType })
        };

        const towersApi = {
            start: (username, bet, difficulty) => apiRequest('/towers/start', { username, bet, difficulty }),
            pick: (username, position) => apiRequest('/towers/pick', { username, position }),
            cashout: (username) => apiRequest('/towers/cashout', { username })
        };

        const plinkoApi = {
            drop: (username, bet, risk) => apiRequest('/plinko/drop', { username, bet, risk })
        };

        const hiloApi = {
            start: (username, bet) => apiRequest('/hilo/start', { username, bet }),
            guess: (username, guess) => apiRequest('/hilo/guess', { username, guess }),
            cashout: (username) => apiRequest('/hilo/cashout', { username })
        };

        const pokerApi = {
            getLobbies: () => apiRequest('/poker/lobbies', {}, 'GET'),
            createTable: (username, buyIn, isDemoMode) => apiRequest('/poker/create-table', { username, buyIn, isDemoMode }),
            joinTable: (username, tableId) => apiRequest('/poker/join-table', { username, tableId }),
            leaveTable: (username, tableId) => apiRequest('/poker/leave-table', { username, tableId }),
            getTable: (tableId) => apiRequest(`/poker/table/${tableId}`, {}, 'GET'),
            bet: (username, tableId, amount) => apiRequest('/poker/bet', { username, tableId, amount }),
            fold: (username, tableId) => apiRequest('/poker/fold', { username, tableId }),
            check: (username, tableId) => apiRequest('/poker/check', { username, tableId }),
            call: (username, tableId) => apiRequest('/poker/call', { username, tableId })
        };

        // ==========================================
        // ENHANCED UI COMPONENTS

        const WinParticles = ({ show, amount }) => {

                    setParticles(newParticles);

            if (!show) return null;

            return (

        // Continue with game components in next part...
        // This file is getting long, let me create the poker component separately

const Poker = ({ user, updateBalance }) => {

            const [selectedTable, setSelectedTable] = useState(null);

                loadLobbies();

                                setShowWin(true);
                                setTimeout(() => setShowWin(false), 3000);

                            setTableData(data);
                            setError(null);
                        } catch (e) {
                            console.error('Failed to load table:', e);
                            setError('Connection lost');

                    };
                    loadTable();
                    const interval = setInterval(loadTable, 2000);
                    return () => clearInterval(interval);
                }

            const createTable = async () => {
                setLoading(true);
                setError(null);

                    const res = await pokerApi.createTable(user.username, buyIn * 100, user.isDemo);
                    updateBalance(res.newBalance);

                    setLoading(false);

                setLoading(true);
                setError(null);

                    const res = await pokerApi.joinTable(user.username, tableId);

                    setError(e.message);
                } finally {
                    setLoading(false);
                }
            };

            const leaveTable = async () => {
                setLoading(true);
                setError(null);

                    const res = await pokerApi.leaveTable(user.username, selectedTable);
                    updateBalance(res.newBalance);
                    setSelectedTable(null);
                    setTableData(null);

                    setError(e.message);
                } finally {
                    setLoading(false);

            const performAction = async (action, amount = null) => {
                setLoading(true);
                setError(null);

                    let res;
                    if (action === 'bet') res = await pokerApi.bet(user.username, selectedTable, amount * 100);

                    else if (action === 'check') res = await pokerApi.check(user.username, selectedTable);

                    setTimeout(async () => {
                        try {
                            const data = await pokerApi.getTable(selectedTable);
                            setTableData(data);
                        } catch (e) {

                                                    D

                                                    {player.username} {isMe && '(You)'}

                                                        Your Turn
                                                    </span>

                                            </div>
                                            
                                            <div className="space-y-2">
                                                <div className="flex items-center gap-2">
                                                    <span className="text-xl">💰</span>
                                                    <span className="text-stake-green font-mono font-bold text-lg">
                                                        ${(player.chips / 100).toFixed(2)}

                                                        🔥 ALL-IN!
                                                    </div>

                                                {player.currentBet > 0 && !player.hasFolded && (
                                                    <div className="text-sm text-yellow-400 font-bold bg-yellow-500/20 px-3 py-1 rounded-full">

                            {/* Your Hand - Enhanced */}

                                        <span className="text-2xl">🎴</span>
                                        <span>Your Hand</span>
                                    </div>
                                    <div className="flex gap-3 md:gap-4 justify-center">
                                        {myPlayer.hand.map((card, i) => (
                                            <div key={i} className="animate-pop-in" style={{animationDelay: `${i*0.1}s`}}>
                                                <CardView card={card} small={window.innerWidth < 768} animated={true} />
                                            </div>
                                        ))}
                                    </div>
                                </div>

                            {/* Action Buttons - Enhanced */}
                            {isMyTurn && myPlayer && !myPlayer.hasFolded && tableData.gameState === 'playing' && (
                                <div className="space-y-4">
                                    <div className="grid grid-cols-2 md:grid-cols-4 gap-3 md:gap-4">
                                        <button 
                                            onClick={() => performAction('fold')} 
                                            disabled={loading} 
                                            className="bg-gradient-to-br from-red-500 to-red-700 hover:from-red-600 hover:to-red-800 text-white py-4 md:py-5 rounded-2xl font-black text-lg touch-feedback disabled:opacity-50 transition-all shadow-lg hover:shadow-glow-red"
                                        >
                                            ❌ FOLD

                                        {canCheck ? (
                                            <button 
                                                onClick={() => performAction('check')} 
                                                disabled={loading} 
                                                className="bg-gradient-to-br from-gray-600 to-gray-800 hover:from-gray-700 hover:to-gray-900 text-white py-4 md:py-5 rounded-2xl font-black text-lg touch-feedback disabled:opacity-50 transition-all shadow-lg"
                                            >
                                                ✓ CHECK
                                            </button>
                                        ) : (
                                            <button 
                                                onClick={() => performAction('call')} 
                                                disabled={loading} 
                                                className="bg-gradient-to-br from-blue-500 to-blue-700 hover:from-blue-600 hover:to-blue-800 text-white py-4 md:py-5 rounded-2xl font-black text-lg touch-feedback disabled:opacity-50 transition-all shadow-lg"
                                            >
                                                📞 CALL<br/>
                                                <span className="text-sm font-normal">${(callAmount / 100).toFixed(2)}</span>
                                            </button>
                                        )}
                                        
                                        <button 
                                            onClick={() => performAction('bet', raiseAmount)} 
                                            disabled={loading || raiseAmount < Math.max(1, callAmount / 100)} 
                                            className="col-span-2 bg-gradient-to-br from-stake-green to-stake-greenHover hover:from-stake-greenHover hover:to-stake-green text-black py-4 md:py-5 rounded-2xl font-black text-lg touch-feedback disabled:opacity-50 transition-all shadow-lg hover:shadow-glow"
                                        >
                                            💪 RAISE<br/>
                                            <span className="text-sm font-normal">${raiseAmount.toFixed(2)}</span>
                                        </button>
                                    </div>
                                    
                                    <div className="glass p-4 md:p-6 rounded-2xl border border-white/10">
                                        <label className="text-gray-300 text-sm font-bold uppercase mb-3 block flex items-center gap-2">
                                            <span>💵</span>
                                            <span>Raise Amount</span>
                                        </label>
                                        <input 
                                            type="range" 
                                            min={Math.max(1, callAmount / 100)}
                                            max={Math.max(1, myPlayer.chips / 100)}
                                            step="0.5"
                                            value={raiseAmount} 
                                            onChange={e => setRaiseAmount(Number(e.target.value))}
                                            className="w-full h-3 bg-gray-700 rounded-lg appearance-none cursor-pointer accent-stake-green"
                                        />
                                        <div className="flex justify-between text-sm text-gray-400 mt-2 font-mono">
                                            <span>${Math.max(1, callAmount / 100).toFixed(2)}</span>
                                            <span className="text-stake-green font-black text-lg">${raiseAmount.toFixed(2)}</span>
                                            <span>${Math.max(1, myPlayer.chips / 100).toFixed(2)}</span>
                                        </div>
                                    </div>
                                </div>
                            )}

                            {tableData.gameState === 'waiting' && !tableData.showdownResults && (
                                <div className="text-center text-gray-300 mt-6 p-8 bg-black/40 rounded-2xl border border-white/10">
                                    <div className="text-5xl mb-4 animate-bounce">⏳</div>
                                    <div className="font-black text-xl mb-2">Waiting for next hand...</div>
                                    <div className="text-base mt-2">
                                        {tableData.players.length < 2

            const currentLobbies = user.isDemo ? lobbies.demo : lobbies.real;

            return (

                            {user.isDemo ? '🎮 Demo Poker Lobbies' : '💰 Real Money Poker'}

                        <button onClick={() => setCreateMode(!createMode)} className="px-6 py-3 bg-btn-gradient text-black font-black rounded-xl touch-feedback shadow-glow hover:scale-105 transition-transform">
                            {createMode ? '✕ Cancel' : '+ New Table'}
                        </button>
                    </div>

                    {error && (
                        <div className="bg-red-500/10 border-2 border-red-500/50 text-red-400 p-4 rounded-xl text-center font-bold animate-shake">

                    {createMode && (

        // ==========================================
        // BLACKJACK - ENHANCED
        // ==========================================
        
        const Blackjack = ({ user, updateBalance }) => {
            const [state, setState] = useState({ bet: 10, result: null, playerHand: [], dealerHand: [], gameStarted: false });
            const [loading, setLoading] = useState(false);
            const [showWin, setShowWin] = useState(false);
            
            const deal = async () => {
                if (state.bet * 100 > user.balance) return alert("Insufficient funds");
                setLoading(true);
                try {
                    const res = await blackjackApi.deal(user.username, state.bet * 100);
                    updateBalance(res.newBalance);
                    setState({ ...state, gameStarted: true, playerHand: res.playerHand, dealerHand: res.dealerHand, result: null });
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };
            
            const hit = async () => {
                setLoading(true);
                try {
                    const res = await blackjackApi.hit(user.username);
                    if (res.bust) {
                        updateBalance(res.newBalance);
                        setState({ ...state, playerHand: res.playerHand, result: { win: 0, message: 'Bust!' }, gameStarted: false });
                    } else {
                        setState({ ...state, playerHand: res.playerHand });
                    }
                } catch (e) { 
                    alert(e.message); 
                } finally {
                    setLoading(false);
                }
            };
            
            const stand = async () => {
                setLoading(true);
                try {
                    const res = await blackjackApi.stand(user.username);
                    updateBalance(res.newBalance);

                        updateBalance(res.newBalance);
                        setState({ ...state, active: false, currentRow: res.currentRow, multiplier: res.multiplier, path: newPath });

                        setTimeout(() => setShowWin(false), 2000);

                { id: 'high', name: 'High', color: 'from-red-500 to-red-700', icon: '🔴' },

            const drop = async () => {
                if (state.bet * 100 > user.balance) return alert("Insufficient funds");
                setLoading(true);
                
                const ballId = Date.now();
                
                try {
                    const res = await plinkoApi.drop(user.username, state.bet * 100, state.risk);
                    updateBalance(res.newBalance);
                    
                    // Animate ball drop
                    setDroppingBalls(prev => [...prev, { id: ballId, slot: res.slot, progress: 0 }]);
                    
                    const dropDuration = 2000;
                    const frames = 60;
                    const frameTime = dropDuration / frames;
                    
                    for (let i = 0; i <= frames; i++) {
                        setTimeout(() => {
                            setDroppingBalls(prev => prev.map(ball => 
                                ball.id === ballId ? { ...ball, progress: i / frames } : ball
                            ));
                        }, i * frameTime);

                        setDroppingBalls(prev => prev.filter(ball => ball.id !== ballId));
                        setState(prevState => ({
                            ...prevState,
                            results: [res, ...prevState.results].slice(0, 5)

                            setShowWin(true);
                            setTimeout(() => setShowWin(false), 1500);

                                    disabled={loading}
                                    className="w-full input-field rounded-xl p-4 text-white font-mono font-black text-xl"
                                />
                            </div>
                            <div>
                                <label className="text-gray-300 text-sm font-bold uppercase mb-3 block">🎯 Risk Level</label>
                                <div className="grid grid-cols-3 gap-2">
                                    {risks.map(risk => (
                                        <button
                                            key={risk.id}
                                            onClick={() => setState({ ...state, risk: risk.id })}
                                            disabled={loading}
                                            className={`py-3 rounded-xl font-bold transition-all touch-feedback ${
                                                state.risk === risk.id

                                        </button>

                                </div>

                        <button

                    </div>

                                        </div>
                                        <div className={`font-mono font-bold ${result.payout > state.bet * 100 ? 'text-stake-green' : 'text-gray-400'}`}>
                                            ${(result.payout / 100).toFixed(2)}
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </div>
                    )}

                    {/* Plinko Board */}

                                    }`}
                                >
                                    {mult}x
                                </div>
                            ))}
                        </div>
                    </div>
                </div>
            );
        };

                                onClick={() => handleLogin(false)} 
                                disabled={loading} 
                                className="w-full bg-btn-gradient text-black font-black py-4 rounded-xl text-lg hover:shadow-glow transition-all touch-feedback disabled:opacity-50 hover:scale-105"
                            >
                                {loading ? 'LOADING...' : 'LOGIN'}
                            </button>
                            <button 
                                onClick={() => handleLogin(true)} 
                                disabled={loading} 
                                className="w-full glass text-gray-300 font-bold py-4 rounded-xl transition-all border border-white/5 touch-feedback disabled:opacity-50 hover:scale-105"
                            >
                                CREATE ACCOUNT
                            </button>
                            
                            <div className="relative my-6">
                                <div className="absolute inset-0 flex items-center">
                                    <div className="w-full border-t border-white/10"></div>
                                </div>
                                <div className="relative flex justify-center text-sm">
                                    <span className="px-4 bg-stake-card text-gray-400 font-medium">OR</span>
                                </div>
                            </div>
                            
                            <button 
                                onClick={handleDemoLogin} 
                                disabled={loading} 
                                className="w-full bg-gold-gradient text-black font-black py-4 rounded-xl hover:shadow-glow-gold transition-all touch-feedback flex items-center justify-center gap-3 disabled:opacity-50 hover:scale-105"
                            >
                                <span className="text-2xl">🎮</span>
                                <span>TRY DEMO MODE</span>
                                <span className="text-sm font-normal">(Free $100)</span>
                            </button>
                        </div>
                    </div>
                </div>
            );

            const GameCard = ({ id, name, icon, gradient }) => (
                <button 
                    onClick={() => setActiveGame(id)} 
                    className="group relative rounded-3xl overflow-hidden aspect-[4/3] shadow-xl hover:shadow-2xl transition-all hover:-translate-y-3 bg-stake-card border-2 border-white/5 hover:border-stake-green/30 touch-feedback"
                >
                    <div className={`absolute inset-0 bg-gradient-to-br ${gradient} opacity-20 group-hover:opacity-30 transition-opacity`}></div>
                    <div className="absolute inset-0 flex flex-col items-center justify-center p-6">
                        <div className="text-5xl md:text-7xl mb-6 transform group-hover:scale-125 group-hover:rotate-6 transition-transform duration-300 drop-shadow-2xl">
                            {icon}
                        </div>
                        <div className="font-black text-xl md:text-3xl text-white tracking-wide uppercase drop-shadow-lg">
                            {name}
                        </div>
                    </div>
                    <div className="absolute inset-0 bg-black/70 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center backdrop-blur-sm">
                        <span className="bg-btn-gradient text-black font-black px-10 py-4 rounded-full transform scale-90 group-hover:scale-100 transition-transform shadow-glow text-lg">
                            PLAY NOW
                        </span>
                    </div>
                </button>
            );

            return (
                <div className="min-h-screen text-stake-text font-sans">
                    <TopBar user={user} onLogout={() => setUser(null)} />
                    
                    <main className="pt-24 md:pt-28 px-4 pb-20 md:pb-6 smooth-scroll">
                        <div className="max-w-[1600px] mx-auto min-h-[calc(100vh-8rem)]">
                            {activeGame ? (
                                <div>
                                    <div className="mb-6 md:mb-10 flex items-center gap-3 text-sm md:text-base text-gray-400 font-bold">
                                        <button className="hover:text-white transition-colors touch-feedback flex items-center gap-2" onClick={() => setActiveGame(null)}>
                                            <span>🏠</span>
                                            <span>Home</span>
                                        </button>
                                        <span className="text-white/20">/</span>
                                        <span className="text-white font-black capitalize">{activeGame}</span>
                                    </div>
                                    {activeGame === 'poker' && <Poker user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'blackjack' && <Blackjack user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'mines' && <Mines user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'coinflip' && <Coinflip user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'roulette' && <Roulette user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'towers' && <Towers user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'plinko' && <Plinko user={user} updateBalance={updateBalance} />}
                                    {activeGame === 'hilo' && <HiLo user={user} updateBalance={updateBalance} />}
                                </div>
                            ) : (
                                <div>
                                    <div className="flex items-center gap-4 mb-8 md:mb-12">
                                        <div className="w-2 h-10 bg-stake-green rounded-full shadow-glow animate-pulse-slow"></div>
                                        <h2 className="text-3xl md:text-4xl font-black text-white tracking-tight">Game Lobby</h2>
                                        {user.isDemo && (
                                            <div className="demo-badge text-black font-bold text-sm px-4 py-2 rounded-full shadow-lg hidden md:block">
                                                🎮 DEMO MODE - Playing with Free Credits
                                            </div>
                                        )}
                                    </div>
                                    <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4 md:gap-8">
                                        <GameCard id="poker" name="Poker" icon="🎴" gradient="from-purple-600 to-indigo-700" />
                                        <GameCard id="blackjack" name="Blackjack" icon="🃏" gradient="from-purple-600 to-blue-600" />
                                        <GameCard id="mines" name="Mines" icon="💣" gradient="from-yellow-500 to-red-600" />
                                        <GameCard id="towers" name="Towers" icon="🏢" gradient="from-orange-500 to-amber-600" />
                                        <GameCard id="plinko" name="Plinko" icon="🎯" gradient="from-pink-500 to-rose-600" />
                                        <GameCard id="roulette" name="Roulette" icon="🎡" gradient="from-red-500 to-pink-600" />
                                        <GameCard id="coinflip" name="Coin Flip" icon="🪙" gradient="from-yellow-400 to-orange-500" />
                                        <GameCard id="hilo" name="Hi-Lo" icon="📊" gradient="from-cyan-500 to-blue-600" />
                                    </div>
                                </div>
                            )}
                        </div>
                    </main>

                    <MobileBottomNav 
                        activeGame={activeGame} 
                        onSelectGame={setActiveGame}
                        onShowMenu={() => setShowMobileMenu(true)}
                    />

                    {showMobileMenu && (
                        <MobileGameMenu 
                            onClose={() => setShowMobileMenu(false)}
                            onSelectGame={setActiveGame}
                        />
                    )}
                </div>
            );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
